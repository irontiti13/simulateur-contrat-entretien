<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PLD Automobiles - Pertuis</title>
  <style>
    body{
      font:16px Arial,sans-serif;
      margin:15px;
      max-width:600px;
    }
    input,select,button{
      width:100%;
      padding:10px;
      margin:4px 0 10px;
      box-sizing:border-box;
    }
    button{
      background:#075da8;
      color:#fff;
      border:0;
      font-weight:700;
      cursor:pointer;
    }
    .h{display:none}
    .ok{background:#eaf8f1;padding:12px;border-radius:8px}
    .ko{background:#fff0ee;padding:12px;border-radius:8px}
    .p{background:#eef2ff;padding:10px;margin:10px 0;border-radius:8px}
    h2,h3{color:#075da8}
  </style>
</head>
<body>

<h3>PLD Automobiles</h3>
<h2>Concession de Pertuis</h2>

<label>Marque</label>
<select id="marque">
  <option value="">Choisissez</option>
  <option value="Volkswagen">Volkswagen</option>
  <option value="SEAT">SEAT</option>
</select>

<label>Motorisation</label>
<select id="motorisation" onchange="gererCarburant()">
  <option value="">Choisissez</option>
  <option value="Électrique">Électrique</option>
  <option value="Hybride">Hybride</option>
  <option value="Thermique">Thermique</option>
</select>

<div id="blocCarburant" class="h">
  <label>Type de carburant</label>
  <select id="carburant">
    <option value="">Choisissez</option>
    <option value="Essence">Essence</option>
    <option value="Diesel">Diesel</option>
  </select>
</div>

<label>Date de première mise en circulation</label>
<input id="dateMec" type="date">

<label>Kilométrage actuel</label>
<input id="kilometrage" type="number">

<button onclick="verifierEligibilite()">Vérifier mon éligibilité</button>

<div id="resultat"></div>

<script>
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycby6JcFlP2wUoO92c911buHomKajMO_fxu6oRF2Nj63bZ444njWYQL_mbl_428e7fX8f/exec";
let resumeSimulation = "";

function $(id){
  return document.getElementById(id);
}

function gererCarburant(){
  const thermique = $("motorisation").value === "Thermique";
  $("blocCarburant").className = thermique ? "" : "h";
  if(!thermique){
    $("carburant").selectedIndex = 0;
  }
}

function ageVehicule(dateStr){
  const aujourdHui = new Date();
  const date = new Date(dateStr);
  let age = aujourdHui.getFullYear() - date.getFullYear();
  const m = aujourdHui.getMonth() - date.getMonth();
  if(m < 0 || (m === 0 && aujourdHui.getDate() < date.getDate())){
    age--;
  }
  return age;
}

function verifierEligibilite(){
  const marque = $("marque").value;
  const motorisation = $("motorisation").value;
  const carburant = $("carburant").value;
  const dateMec = $("dateMec").value;
  const kilometrage = Number($("kilometrage").value || 0);

  const erreurs = [];

  if(!marque || !motorisation || !dateMec || !kilometrage){
    $("resultat").innerHTML = '<div class="ko"><b>Merci de compléter tous les champs.</b></div>';
    return;
  }

  if(motorisation === "Thermique" && !carburant){
    $("resultat").innerHTML = '<div class="ko"><b>Merci de compléter tous les champs.</b></div>';
    return;
  }

  const dateDebut = new Date(dateMec);
  const dateJour = new Date();
  const anneesEcoulees = (dateJour - dateDebut) / (365.25 * 24 * 60 * 60 * 1000);

  if(anneesEcoulees <= 0){
    $("resultat").innerHTML = '<div class="ko"><b>La date de première mise en circulation est incorrecte.</b></div>';
    return;
  }

  const kmAnnuel = Math.round(kilometrage / anneesEcoulees);
  const age = ageVehicule(dateMec);

  if(age > 13) erreurs.push("véhicule de plus de 13 ans");
  if(kilometrage > 220000) erreurs.push("kilométrage supérieur à 220 000 km");

  let prix = 0;
  let unite = "TTC/mois";
  let texteInfo = "";
  let prestations = "";

  if(motorisation === "Électrique"){
    prix = 14.90;
    texteInfo =
      'Kilométrage annuel moyen calculé : ' + kmAnnuel.toLocaleString("fr-FR") + ' km/an<br>' +
      '<b>Contrat d’entretien de 24 mois dans la limite de 40 000 km parcourus à compter de la souscription</b>';
    prestations =
      '<ul>' +
      '<li>Points de contrôle</li>' +
      '<li>Filtre à pollen</li>' +
      '<li>Essuie-glaces avant et lave-glace</li>' +
      '<li>Liquide de frein</li>' +
      '<li>Entretien intermédiaire</li>' +
      '<li>Main-d’œuvre</li>' +
      '</ul>';
  } else {
    if(kmAnnuel >= 20000){
      erreurs.push("kilométrage annuel moyen égal ou supérieur à 20 000 km");
    }

    prix = marque === "Volkswagen" ? 31.90 : 29.90;

    texteInfo =
      'Kilométrage annuel moyen calculé : ' + kmAnnuel.toLocaleString("fr-FR") + ' km/an<br>' +
      'Contrat 2 ans ou 40 000 km';

    if(motorisation === "Thermique" && carburant === "Essence"){
      prestations =
        '<ul>' +
        '<li>Points de contrôle</li>' +
        '<li>Huile moteur et éléments de vidange</li>' +
        '<li>Filtre à huile</li>' +
        '<li>Filtre à pollen</li>' +
        '<li>Filtre à air</li>' +
        '<li>Bougies d’allumage</li>' +
        '<li>Essuie-glaces avant et lave-glace</li>' +
        '<li>Liquide de frein</li>' +
        '<li>Entretien intermédiaire 1 an sans vidange</li>' +
        '<li>Appoint d’huile moteur compris</li>' +
        '<li>Main-d’œuvre</li>' +
        '</ul>';
    } else if(motorisation === "Thermique" && carburant === "Diesel"){
      prestations =
        '<ul>' +
        '<li>Points de contrôle</li>' +
        '<li>Huile moteur et éléments de vidange</li>' +
        '<li>Filtre à huile</li>' +
        '<li>Filtre à pollen</li>' +
        '<li>Filtre à air</li>' +
        '<li>Filtre à carburant</li>' +
        '<li>Essuie-glaces avant et lave-glace</li>' +
        '<li>Liquide de frein</li>' +
        '<li>Entretien intermédiaire 1 an sans vidange</li>' +
        '<li>Appoint d’huile moteur compris</li>' +
        '<li>Main-d’œuvre</li>' +
        '</ul>';
    } else {
      prestations =
        '<ul>' +
        '<li>Points de contrôle</li>' +
        '<li>Huile moteur et éléments de vidange</li>' +
        '<li>Filtre à huile</li>' +
        '<li>Filtre à pollen</li>' +
        '<li>Filtre à air</li>' +
        '<li>Essuie-glaces avant et lave-glace</li>' +
        '<li>Liquide de frein</li>' +
        '<li>Entretien intermédiaire 1 an sans vidange</li>' +
        '<li>Appoint d’huile moteur compris</li>' +
        '<li>Main-d’œuvre</li>' +
        '</ul>';
    }
  }

  if(erreurs.length){
    $("resultat").innerHTML =
      '<div class="ko">' +
      '<b>Véhicule non éligible</b><br><br>' +
      'Kilométrage annuel moyen calculé : <b>' + kmAnnuel.toLocaleString("fr-FR") + ' km/an</b><br><br>' +
      erreurs.join("<br>") +
      '</div>';
    return;
  }

  const descriptionVehicule = marque + " – " + motorisation + (motorisation === "Thermique" ? " – " + carburant : "");

  resumeSimulation =
    descriptionVehicule +
    " | " + prix.toFixed(2) + " € " + unite +
    " | Kilométrage annuel moyen calculé : " + kmAnnuel.toLocaleString("fr-FR") + " km/an";

  $("resultat").innerHTML =
    '<div class="ok">' +
      '<b>Véhicule éligible</b>' +
      '<h2>' + prix.toFixed(2).replace(".", ",") + ' € ' + unite + '</h2>' +
      '<b>' + descriptionVehicule + '</b>' +
      '<p>' + texteInfo + '</p>' +
      '<h3>Prestations comprises</h3>' +
      prestations +
      '<p>Entrez vos coordonnées pour être recontacté.</p>' +

      '<form action="' + URL_SCRIPT + '" method="POST" accept-charset="UTF-8">' +
        '<label>Conseiller client</label>' +
        '<select name="conseiller" required>' +
          '<option value="">Choisissez</option>' +
          '<option value="Richard Salle">Richard Salle</option>' +
          '<option value="Marion Bertrand">Marion Bertrand</option>' +
          '<option value="Paola Bussetta">Paola Bussetta</option>' +
        '</select>' +

        '<label>Nom du client</label>' +
        '<input name="nom" type="text" placeholder="Nom" required>' +

        '<label>Prénom du client</label>' +
        '<input name="prenom" type="text" placeholder="Prénom" required>' +

        '<label>Téléphone du client</label>' +
        '<input name="telephone" type="tel" placeholder="Téléphone" required>' +

        '<label>Adresse e-mail du client</label>' +
        '<input name="email" type="email" placeholder="E-mail" required>' +

        '<input name="site" type="hidden" value="Pertuis">' +
        '<input name="simulation" type="hidden" value="' + resumeSimulation.replace(/"/g, '&quot;') + '">' +

        '<button type="submit">Demander à être recontacté</button>' +
      '</form>' +
    '</div>';
}
</script>

</body>
</html>
