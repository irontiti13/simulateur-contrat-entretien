<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>body{font:16px Arial;margin:15px;max-width:600px}input,select,button{width:100%;padding:10px;margin:4px 0 10px;box-sizing:border-box}button{background:#075da8;color:#fff;border:0;font-weight:700}.h{display:none}.ok{background:#eaf8f1;padding:12px}.ko{background:#fff0ee;padding:12px}.p{background:#eef2ff;padding:10px;margin:10px 0}</style><h3>PLD Automobiles</h3><h2>Votre contrat d’entretien</h2><label>Marque</label><select id=b onchange=u()><option value="">Choisissez</option><option>Volkswagen</option><option>Volkswagen Utilitaires</option><option>Škoda</option><option>SEAT</option><option>CUPRA</option></select><div id=vp><label>Motorisation</label><select id=e onchange=t()><option value="">Choisissez</option><option>Électrique</option><option>Hybride</option><option>Thermique</option></select><div id=carb class=h><label>Type de carburant</label><select id=c><option value="">Choisissez</option><option>Essence</option><option>Diesel</option></select></div></div><div id=vu class=h><label>Modèle utilitaire</label><select id=m><option value="">Choisissez</option><option>Caddy</option><option>Transporter</option><option>Multivan</option><option>Caravelle</option><option>Crafter</option><option>Amarok</option></select></div><label>Date de première mise en circulation</label><input id=d type=date><label>Kilométrage actuel</label><input id=k type=number><button onclick=z()>Vérifier mon éligibilité</button><div id=o></div><script>const $=x=>document.getElementById(x),D='thierry.barbieri@pldauto.fr';let Q='';function u(){x=$('b').value=='Volkswagen Utilitaires';$('vu').className=x?'':'h';$('vp').className=x?'h':'';if(x){$('carb').className='h';$('c').selectedIndex=0}else t()}function t(){thermique=$('e').value=='Thermique';$('carb').className=thermique?'':'h';if(!thermique)$('c').selectedIndex=0}function ag(s){n=new Date;x=new Date(s);y=n.getFullYear()-x.getFullYear();return y-(n<new Date(n.getFullYear(),x.getMonth(),x.getDate()))}function z(){
B=$('b').selectedIndex;
E=$('e').selectedIndex;
M=$('m').selectedIndex;

dateMec=$('d').value;

R=[];

if(!B||!dateMec||!K||(B==2&&!M)||(B!=2&&!E)||(B!=2&&E==3&&!C))
return $('o').innerHTML='<div class=ko><b>Merci de compléter tous les champs.</b></div>';

anneesEcoulees=(dateJour-dateDebut)/(365.25*24*60*60*1000);

return $('o').innerHTML='<div class=ko><b>La date de première mise en circulation est incorrecte.</b></div>';

T=[[15000,17,30000,35],[20000,19,40000,38],[20000,19,40000,38],[20000,19,40000,38],[25000,24,50000,46],[15000,21,30000,43]][M-1];
F=A<=T[0]?[T[0],T[1]]:A<=T[2]?[T[2],T[3]]:0;
if(!F)R.push('kilométrage annuel moyen trop élevé');
else{
P=F[1];
U='HT/mois';
X='Kilométrage annuel moyen calculé : '+A.toLocaleString('fr-FR')+' km/an<br>Tranche retenue : jusqu’à '+F[0].toLocaleString('fr-FR')+' km/an'
}
S=$('b').value+' – '+$('m').value
}else{
P=E==1?14.9:B==1?31.9:29.9;
U='TTC/mois';

if(E==1){
X='Kilométrage annuel moyen calculé : '+A.toLocaleString('fr-FR')+' km/an<br><b>Contrat d’entretien de 24 mois dans la limite de 40 000 km parcourus à compter de la souscription</b><br><br>Réservé aux véhicules Volkswagen de moins de 13 ans à la date de première mise en circulation et de moins de 220 000 km, immatriculés dans le réseau participant en France métropolitaine.';
}else{
if(A>=20000)R.push('kilométrage annuel moyen égal ou supérieur à 20 000 km');

}

S=$('b').value+' – '+$('e').value+(E==3?' – '+$('c').value:'')
}

if(R.length)
return $('o').innerHTML='<div class=ko><b>Véhicule non éligible</b><br><br>Kilométrage annuel moyen calculé : <b>'+A.toLocaleString('fr-FR')+' km/an</b><br><br>'+R.join('<br>')+'</div>';

V='<div class=p><h3>Avantages supplémentaires avec le contrat souscrit</h3>'+
'<p><b>20 % de remise pour les véhicules de 5 à 7 ans</b><br>'+
'<b>30 % de remise pour les véhicules de 8 ans et plus</b></p>'+
(Y<5?'<p><i>Votre véhicule n’a pas encore 5 ans : cette remise s’appliquera à partir de ses 5 ans.</i></p>':
'<p><b>Remise applicable à votre véhicule : '+(Y<8?'20 %':'30 %')+'</b></p>')+
'<p>Remise applicable sur :</p><ul>'+
'<li>Freinage</li>'+
'<li>Amortisseurs</li>'+
'<li>Courroies</li>'+
'<li>Remplacement des balais d’essuie-glace avant</li>'+
'<li>Remplacement du balai d’essuie-glace arrière</li>'+
'<li>Remplacement de la pompe à eau</li>'+
'<li>Contrôle et remplacement de la batterie</li>'+
'<li>Remplacement du filtre à pollen</li>'+
'</ul></div>';

if(E==1){
prestations='<ul><li>Points de contrôle</li><li>Filtre à pollen</li><li>Essuie-glaces avant et lave-glace</li><li>Liquide de frein</li><li>Entretien intermédiaire</li><li>Main-d’œuvre</li></ul>';
}else if(E==3&&C==1){

}else if(E==3&&C==2){
prestations='<ul><li>Points de contrôle</li><li>Huile moteur et éléments de vidange</li><li>Filtre à huile</li><li>Filtre à pollen</li><li>Filtre à air</li><li>Filtre à carburant</li><li>Essuie-glaces avant et lave-glace</li><li>Liquide de frein</li><li>Entretien intermédiaire 1 an sans vidange</li><li>Appoint d’huile moteur compris</li><li>Main-d’œuvre</li></ul>';
}else{
prestations='<ul><li>Points de contrôle</li><li>Huile moteur et éléments de vidange</li><li>Filtre à huile</li><li>Filtre à pollen</li><li>Filtre à air</li><li>Essuie-glaces avant et lave-glace</li><li>Liquide de frein</li><li>Entretien intermédiaire 1 an sans vidange</li><li>Appoint d’huile moteur compris</li><li>Main-d’œuvre</li></ul>';
}

}</script>
