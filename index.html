erci de compléter tous les champs.</b></div>';if(Y>13)R.push('véhicule de plus de 13 ans');if(K>220000)R.push('kilométrage supérieur à 220 000 km');if(B==2){T=[[15000,17,30000,35],[20000,19,40000,38],[20000,19,40000,38],[20000,19,40000,38],[25000,24,50000,46],[15000,21,30000,43]][M-1];F=A<=T[0]?[T[0],T[1]]:A<=T[2]?[T[2],T[3]]:0;if(!F)R.push('kilométrage annuel trop élevé');else{P=F[1];U='HT/mois';X='Votre estimation : '+A+' km/an<br>Tranche retenue : jusqu’à '+F[0]+' km/an'}S=$('b').value+' – '+$('m').value}else{if(A>=20000)R.push('kilométrage annuel égal ou supérieur à 20 000 km');P=E==1?14.9:B==1?31.9:29.9;U='TTC/mois';X='Contrat 2 ans ou 40 000 km';S=$('b').value+' – '+$('e').value}if(R.length)return $('o').innerHTML='<div class=ko><b>Véhicule non éligible</b><br>'+R.join('<br>')+'</div>';V=B==1&&Y>=5?'<div class=p><b>Remise si contrat souscrit : '+(Y<8?'20 %':'30 %')+'</b></div>':'';Q=S+' | '+P.toFixed(2)+' € '+U;$('o').innerHTML='<div class=ok><b>Véhicule éligible</b><h2>'+P.toFixed(2).replace('.',',')+' € '+U+'</h2><b>'+S+'</b><p>'+X+'</p>'+V+'<h3>Prestations comprises</h3><ul><li>Points de contrôle</li><li>Huile moteur et éléments de vidange</li><li>Filtres</li><li>Essuie-glaces avant et lave-glace</li><li>Liquide de frein</li><li>Bougies d’allumage pour les véhicules essence</li><li>Entretien intermédiaire 1 an sans vidange</li><li>Appoint d’huile moteur compris</li><li>Main-d’œuvre</li></ul><p>Entrez vos coordonnées pour être recontacté.</p><form action="https://formsubmit.co/thierry.barbieri@pldauto.fr" method="POST"><label>Téléphone du client</label><input name="Téléphone du client" type="tel" placeholder="Téléphone" required><label>Adresse e-mail du client</label><input name="Adresse e-mail du client" type="email" placeholder="E-mail" required><input name="Simulation demandée" type="hidden" value="'+Q.replace(/"/g,'&quot;')+'"><input type="hidden" name="_subject" value="Nouvelle demande de contrat d’entretien"><input type="hidden" name="_template" value=
